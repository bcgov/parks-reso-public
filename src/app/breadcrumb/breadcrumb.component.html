<nav class="action-container" aria-label="breadcrumb">
  <ol class="breadcrumb">
    @if (activeBreadcrumb) {
      <li class="breadcrumb-item">
        <span class="fake-anchor-tag" href="javascript:void(0);" (click)="emitBreadcrumb('', null)">Home</span>
      </li>
    }
    @if (!activeBreadcrumb) {
      <li class="breadcrumb-item active" aria-current="page">Home</li>
    }
    @for (breadcrumb of breadcrumbs; track breadcrumb) {
      <li class="breadcrumb-item">
        <span class="fake-anchor-tag" (click)="emitBreadcrumb(breadcrumb.url, breadcrumb.params)">
          {{ breadcrumb.label }}
        </span>
      </li>
    }
    @if (activeBreadcrumb) {
      <li class="breadcrumb-item active" aria-current="page">{{ activeBreadcrumb.label }}</li>
    }
  </ol>
</nav>
